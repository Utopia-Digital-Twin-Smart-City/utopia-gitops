apiVersion: app/v1
kind: Deployment
metadata: 
    name: utopia-frontend
spec:
    replicas: {{ .Values.replicaCount }}
    matchlabels:
        app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            containers:
                - name: utopia-frontend
                  image: {{ .Values.image.frontend-repository }}
                  ports:
                    - name: http
                      containerPort: 80
                      protocol: TCP